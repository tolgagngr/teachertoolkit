function anonymizeRealNames(txt){
  if(!txt)return"";
  let out=String(txt);
  const escRx=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  const L=S.roster.split("\n").map(s=>s.trim()).filter(Boolean);
  const items=L.map((raw,idx)=>({
    clean:raw.replace(/^\d+\s*[,;:.\-]\s*/,"").trim(),
    anon:`${t("stu_default")} ${idx+1}`
  })).filter(x=>x.clean.length>=2);

  // Pass 1: Full names & 2-word suffixes (longest first so "Nguyen Minh Anh" beats "Nguyen Minh")
  const phrases=[];
  items.forEach(it=>{
    phrases.push({p:it.clean,anon:it.anon});
    const parts=it.clean.split(/\s+/).filter(Boolean);
    if(parts.length>=3)phrases.push({p:parts.slice(-2).join(" "),anon:it.anon});
  });
  phrases.sort((a,b)=>b.p.length-a.p.length);
  phrases.forEach(({p,anon})=>{
    try{out=out.replace(new RegExp("(?<![\\p{L}\\p{N}])"+escRx(p)+"(?![\\p{L}\\p{N}])","giu"),anon)}
    catch(e){out=out.replace(new RegExp(escRx(p),"gi"),anon)}
  });

  // Pass 2: Individual name tokens (3+ chars case-insensitive; 2-char capitalized names case-sensitive so "an"/"my" in English prose stay intact)
  const tokList=[];
  items.forEach(it=>{
    it.clean.split(/\s+/).forEach(tok=>{
      if(!tok||/^\d+$/.test(tok))return;
      if(tok.length>=3)tokList.push({tok,anon:it.anon,ci:true});
      else if(tok.length===2&&/^\p{Lu}/u.test(tok))tokList.push({tok,anon:it.anon,ci:false});
    });
  });
  tokList.sort((a,b)=>b.tok.length-a.tok.length);
  tokList.forEach(({tok,anon,ci})=>{
    try{out=out.replace(new RegExp("(?<![\\p{L}\\p{N}])"+escRx(tok)+"(?![\\p{L}\\p{N}])",ci?"giu":"gu"),anon)}catch(e){}
  });
  return out;
}

function buildStudentDataLine(i,noNum){
  const vc=visCrit(),vt=visTick();
  const anon=`${t("stu_default")} ${i}`;
  const strongC=[],devC=[],lowC=[];
  vc.forEach(c=>{
    const v=S.sc[i+"|"+c.id];
    if(v==null)return;
    const desc=(v>=3?cFld(c,"h"):v==2?cFld(c,"m"):cFld(c,"l")).split("[NAME]").join(anon);
    const label=`${cFld(c,"n")} — ${desc}`;
    if(v>=3)strongC.push(label);
    else if(v==2)devC.push(label);
    else lowC.push(label);
  });
  const strTicks=vt.filter(tk=>S.tk[i+"|"+tk.id]==="s").map(tk=>{
    const s=tFld(tk,"st").split("[NAME]").join(anon);
    return `${tFld(tk,"n")}${s?" ("+s+")":""}`;
  });
  const nsTicks=vt.filter(tk=>S.tk[i+"|"+tk.id]==="p").map(tk=>{
    const s=tFld(tk,"ns");
    return `${tFld(tk,"n")}${s?" ("+s+")":""}`;
  });
  const note=anonymizeRealNames(((S.nt&&S.nt[i])||"").trim());
  if(!strongC.length&&!devC.length&&!lowC.length&&!strTicks.length&&!nsTicks.length&&!note)return null;

  const ov=stuScore(i).over10;
  const blocks=[`[${i}] ${anon}`];
  if(ov!=null&&!noNum)blocks.push(`Overall: ${fmt10(ov)}`);
  if(strongC.length)blocks.push(`Strong criteria: ${strongC.join("; ")}`);
  if(devC.length)blocks.push(`Developing criteria: ${devC.join("; ")}`);
  if(lowC.length)blocks.push(`Needs-support criteria: ${lowC.join("; ")}`);
  if(strTicks.length)blocks.push(`Tapped strengths (✓): ${strTicks.join("; ")}`);
  if(nsTicks.length)blocks.push(`Tapped next steps (→): ${nsTicks.join("; ")}`);
  if(note)blocks.push(`Teacher note: ${note}`);
  return blocks.join("\n  - ");
}

function buildAiPrompt(tone,custom,noNum,onlyStu,from,to){

    prof:"professional, polished, and balanced report-card style (2–3 clear, objective, constructive sentences)",
    growth:"motivating growth-mindset style (2–3 sentences that highlight progress and frame next steps as achievable goals)",
    concise:"short, crisp, and readable (2 smooth sentences per student)",

  const toneMapVi={
    warm:"ấm áp, quan tâm và khích lệ (2–3 câu tự nhiên, ghi nhận sự cố gắng và góp ý nhẹ nhàng)",

    growth:"khích lệ tư duy phát triển (2–3 câu nhấn mạnh sự tiến bộ và xem mục cần cải thiện là mục tiêu tiếp theo)",
    concise:"ngắn gọn, súc tích và mạch lạc (2 câu trôi chảy mỗi học sinh)",
    detailed:"chi tiết, sâu sắc (3–4 câu đầy đủ điểm mạnh và hướng rèn luyện cụ thể)"
  };
  const toneDesc=(LANG==="vi"?toneMapVi[tone]||toneMapVi.warm:toneMapEn[tone]||toneMapEn.warm);
  const customClean=(custom||"").trim();
  const prjClean=anonymizeRealNames((S.proj||"").trim());

    :"";
  const numRule=noNum
    ?(LANG==="vi"
      ?"- KHÔNG viết điểm số dạng con số (như 4/10, 2/4, 7.5/10). Hãy chuyển mức độ thành lời văn tự nhiên.\n"
      :"- DO NOT mention raw numbers or fractions (such as '4 out of 10', '6.9/10', or '2/4'). Turn rubric levels into natural teacher prose.\n")
    :"";
  const customRule=customClean
    ?(LANG==="vi"?`- Yêu cầu riêng của giáo viên về giọng văn/phong cách: ${customClean}\n`:`- Extra teacher style instructions: ${customClean}\n`)
    :"";

  const hdr=LANG==="vi"
    ?`Bạn là một giáo viên giàu kinh nghiệm đang viết nhận xét gửi học sinh/phụ huynh bằng tiếng Việt.\n${ctxLine}Phong cách: ${toneDesc}.\nQuy tắc bắt buộc:\n- MỞ ĐẦU BẰNG NHÃN HỌC SINH: Bắt đầu mỗi nhận xét bằng đúng nhãn đã cho (ví dụ \"Học sinh 3\") làm chủ ngữ; tránh đại từ như \"anh ấy\", \"cô ấy\", \"cậu ấy\" — hãy lặp lại nhãn hoặc viết lại câu.\n- CỤ THỂ: Nêu đúng kỹ năng trong dữ liệu thay vì khen chung chung; tránh những câu sáo rỗng như \"cố gắng phát huy\" nếu dữ liệu không nói vậy.\n- BÁM SÁT VÀ LIÊN KẾT DỮ LIỆU ĐÃ CHẤM: Kết nối tự nhiên giữa các tiêu chí đạt tốt (Strong criteria) với Điểm mạnh đã chọn (✓), và liên kết các tiêu chí Đang tiến bộ / Cần hỗ trợ với Mục cần cải thiện (→) thành lời khuyên cụ thể, hợp lý.\n- KHÔNG MÂU THUẪN: Không khen kỹ năng đang nằm ở mục Cần hỗ trợ hoặc Cần cải thiện (→); không chê kỹ năng nằm ở mục Điểm mạnh (✓) hoặc tiêu chí đạt tốt.\n- KHÔNG BỊA THÊM: Chỉ nói về các tiêu chí, thẻ và ghi chú đã cung cấp — mỗi thẻ đã chọn nên được thể hiện tự nhiên trong nhận xét.\n- ĐA DẠNG GIỮA CÁC HỌC SINH: Thay đổi cách mở đầu câu, cấu trúc câu và từ nối giữa các học sinh để mỗi nhận xét mang cảm giác viết riêng, không lặp khuôn; độ dài thay đổi nhẹ và không bắt đầu hai nhận xét giống nhau.\n- MỘT BƯỚC TIẾP THEO RÕ RÀNG: Kết thúc bằng một việc cụ thể, khả thi để học sinh luyện tập, diễn đạt tích cực.\n${numRule}${customRule}- Nếu học sinh có "Teacher note", giữ lại ý đó ở cuối câu với tiền tố "Ghi chú: ...".\n- ĐỊNH DẠNG ĐẦU RA: Dùng đúng tên ẩn danh "Học sinh 1", "Học sinh 2"... Trả về DUY NHẤT danh sách, mỗi học sinh một dòng (không markdown ** hay dấu đầu dòng), ví dụ:\n1: Học sinh 1 ...\n2: Học sinh 2 ...\n\nDữ liệu học sinh:\n`
    :`You are an experienced classroom teacher writing coherent, personalized report comments in English.\n${ctxLine}Tone & style: ${toneDesc}.\nStrict rules:\n- START WITH THE NAME: Begin every comment with the student label exactly as given (for example \"Student 3\") as the subject. Never use pronouns (he, she, they, him, her, his, their): repeat the label or rephrase the sentence instead.\n- BE SPECIFIC: Name the actual skills from the data (for example \"linking ideas with because\") instead of general praise. Avoid filler such as \"keep up the good work\", \"a pleasure to teach\" or \"great effort\" unless the data supports it.\n- LINK CRITERIA AND TAPPED BUTTONS LOGICALLY: Weave Strong criteria together with Tapped strengths (✓) into natural praise, and connect Developing / Needs-support criteria with Tapped next steps (→) into clear, actionable advice.\n- NO CONTRADICTIONS: Never praise a skill listed under Needs-support or Tapped next steps (→), and never criticize a skill listed under Strong criteria or Tapped strengths (✓).\n- STAY GROUNDED: Reflect the specific criteria and tapped buttons provided for each student — do not invent unrelated skills, habits, examples, quotes, events, causes or home-life details.\n- ONE CLEAR NEXT STEP: Finish with one concrete, doable thing the student can practise, framed positively.\n- VARY EVERY COMMENT: Use distinct sentence openings, structures, and transitions from student to student so comments never feel copy-pasted. Vary the length slightly and never start two comments the same way.\n${numRule}${customRule}- If a "Teacher note" is present, include it at the end starting with "Note: ...".\n- OUTPUT FORMAT: Refer to each student ONLY as "Student 1", "Student 2", etc. Return ONLY the list with one student per line (no markdown bolding or bullets), like:\n1: Student 1 ...\n2: Student 2 ...\n\nStudent data:\n`;
  return hdr+entries.join("\n\n");
}


function buildBehAiPrompt(tone,custom,noNum,onlyStu,from,to){
  const m=S.bmode||"day",p=bPeriod(),pl=bPeriodLabel();
  const start=onlyStu||from||1,end=onlyStu||to||S.n;
  const entries=[];
  for(let i=start;i<=end;i++){
    const A=bLogsFor(i).filter(x=>ct(x.c)!="!");
    if(!A.length)continue;
    const grp=tp=>{const o={};A.filter(x=>ct(x.c)==tp).forEach(x=>o[x.c]=(o[x.c]||0)+1);return Object.entries(o).sort((a,b)=>b[1]-a[1])};
    const P=grp("+"),N=grp("-");
    const anon=`${t("stu_default")} ${i}`;
    const blocks=[`[${i}] ${anon}`];
    if(P.length)blocks.push(`Positive behaviours: `+P.map(x=>cn(x[0])+(x[1]>1?" (×"+x[1]+")":"")).join("; "));
    if(N.length)blocks.push(`Classroom concerns: `+N.map(x=>cn(x[0])+(x[1]>1?" (×"+x[1]+")":"")).join("; "));
    if(m==="month"){
      const pm=prev(p),plog=S.log.filter(x=>x.s==i&&logMonth(x)==pm);
      if(plog.length){
        const pc=plog.filter(x=>ct(x.c)=="-").length,cc=A.filter(x=>ct(x.c)=="-").length;
        blocks.push(`Compared to last month: ${cc<pc?"fewer concerns than last month":cc>pc?"more concerns than last month":"similar concern level to last month"}`);
      }
    }
    entries.push(blocks.join("\n  - "));
  }
  if(!entries.length)return"";

  const periodTxt=m==="day"?(LANG==="vi"?`ngày ${pl}`:`today (${pl})`)
    :m==="week"?(LANG==="vi"?`tuần ${pl}`:`this week (${pl})`)
    :(LANG==="vi"?`tháng ${pl}`:`this month (${pl})`);
  const toneMapEn={
    warm:"warm, supportive, and encouraging (1–2 natural sentences per student)",
    parent:"friendly, clear, and parent-focused (1–2 sentences families can easily act on)",
    prof:"professional, calm, and objective (1–2 concise sentences)",
    growth:"motivating growth-mindset style (1–2 sentences framing habits positively)",
    concise:"very short and direct (1–2 crisp sentences)",
    detailed:"thoughtful and clear (2–3 sentences covering strengths and classroom habits)"
  };
  const toneMapVi={
    warm:"ấm áp, khích lệ và gần gũi (1–2 câu tự nhiên cho mỗi học sinh)",
    parent:"thân thiện, rõ ràng, dễ phối hợp với phụ huynh (1–2 câu)",
    prof:"chuyên nghiệp, điềm tĩnh và khách quan (1–2 câu)",
    growth:"khích lệ tư duy phát triển, hướng tới thói quen tích cực (1–2 câu)",
    concise:"ngắn gọn, súc tích (1–2 câu)",
    detailed:"chi tiết, rõ ràng (2–3 câu nêu rõ mặt tích cực và điểm cần rèn)"
  };
  const toneDesc=(LANG==="vi"?toneMapVi[tone]||toneMapVi.warm:toneMapEn[tone]||toneMapEn.warm);
  const customClean=(custom||"").trim();
  const numRule=noNum
    ?(LANG==="vi"?"- Không nêu số lần khô khan (như ×3); hãy diễn đạt tự nhiên (ví dụ: thường xuyên, nhiều lần, đôi lúc).\n":"- Avoid robotic counts like '(×3)'; express frequency naturally (e.g., consistently, several times, occasionally).\n")
    :"";
  const customRule=customClean
    ?(LANG==="vi"?`- Yêu cầu riêng của giáo viên: ${customClean}\n`:`- Extra teacher instructions: ${customClean}\n`)
    :"";

  const hdr=LANG==="vi"
    ?`Bạn là giáo viên viết nhận xét nề nếp / hành vi cho ${periodTxt} bằng tiếng Việt.\nPhong cách: ${toneDesc}.\nQuy tắc bắt buộc:\n- Bắt đầu mỗi nhận xét bằng đúng nhãn học sinh (ví dụ "Học sinh 3"); không dùng đại từ anh ấy/cô ấy/cậu ấy.\n- CHỈ dựa trên các hành vi tích cực và nhắc nhở đã ghi nhận — không bịa thêm sự việc.\n- Giữ thái độ tôn trọng, xây dựng và đa dạng cách diễn đạt giữa các học sinh (không lặp khuôn).\n${numRule}${customRule}- Trả về DUY NHẤT danh sách, mỗi học sinh một dòng (không markdown ** hay dấu đầu dòng), ví dụ:\n1: Học sinh 1 ...\n2: Học sinh 2 ...\n\nDữ liệu nề nếp:\n`
    :`You are a classroom teacher writing natural behaviour comments for ${periodTxt} in English.\nTone & style: ${toneDesc}.\nStrict rules:\n- Start every comment with the exact student label (e.g. "Student 3") and avoid he/she/they pronouns.\n- Stay strictly grounded in the logged positive behaviours and classroom concerns — do not invent events.\n- Keep the phrasing constructive, respectful, and distinctly varied from student to student.\n${numRule}${customRule}- Return ONLY the list with one student per line (no markdown bolding or bullets), like:\n1: Student 1 ...\n2: Student 2 ...\n\nBehaviour data:\n`;
  return hdr+entries.join("\n\n");
}

function buildRepAiPrompt(tone,custom,noNum,onlyStu,from,to){
  const fromD=S.rfrom||today(),toD=S.rto||today();
  const {rows}=collectRangeReport(fromD,toD);

  rows.forEach(r=>{
    if(r.idx<start||r.idx>end)return;
    const anon=`${t("stu_default")} ${r.idx}`;
    const blocks=[`[${r.idx}] ${anon}`];
    if(r.scores&&!noNum)blocks.push(`Academic scores: ${r.scores}`);
    else if(r.scores)blocks.push(`Academic assessments: ${r.scores.replace(/:\s*\d+(?:\.\d+)?\/10/g,"")}`);
    if(r.defaultNotes)blocks.push(`Project comments & notes: ${anonymizeRealNames(r.defaultNotes)}`);
    if(r.posList.length)blocks.push(`Positive behaviour: ${r.posList.join(", ")}`);
    if(r.conList.length)blocks.push(`Behaviour concerns: ${r.conList.join(", ")}`);
    if(r.prog)blocks.push(`Progress checks: ${r.prog}`);
    if(blocks.length>1)entries.push(blocks.join("\n  - "));
  });
  if(!entries.length)return"";

  const toneMapEn={
    warm:"warm, encouraging, and cohesive (2–4 natural sentences blending academic performance and classroom behaviour)",
    parent:"friendly, clear, and parent-focused (2–4 sentences families can easily understand)",
    prof:"professional, balanced report-card style (2–3 clear, objective sentences)",
    growth:"motivating growth-mindset style (2–4 sentences highlighting progress and clear next steps)",
    concise:"short and crisp (2 smooth sentences combining academics and behaviour)",
    detailed:"thorough and well-crafted (3–4 sentences covering academic strengths, behaviour habits, and next steps)"
  };
  const toneMapVi={
    warm:"ấm áp, khích lệ và mạch lạc (2–4 câu kết hợp tự nhiên giữa học tập và nề nếp)",
    parent:"thân thiện, rõ ràng cho phụ huynh (2–4 câu dễ hiểu)",
    prof:"chuyên nghiệp, cân bằng theo phong cách học bạ (2–3 câu khách quan)",
    growth:"khích lệ tư duy phát triển (2–4 câu nêu rõ tiến bộ và mục tiêu tiếp theo)",
    concise:"ngắn gọn, súc tích (2 câu gộp cả học tập và nề nếp)",
    detailed:"chi tiết, đầy đủ (3–4 câu gồm điểm mạnh học tập, thói quen nề nếp và hướng rèn luyện)"
  };
  const toneDesc=(LANG==="vi"?toneMapVi[tone]||toneMapVi.warm:toneMapEn[tone]||toneMapEn.warm);
  const customClean=(custom||"").trim();
  const numRule=noNum
    ?(LANG==="vi"?"- KHÔNG viết điểm số thô dạng con số (như 6.5/10, 4/10); hãy chuyển thành lời nhận xét tự nhiên.\n":"- DO NOT repeat raw score numbers like '6.5/10' or '4/10'; translate performance into natural teacher prose.\n")
    :"";
  const customRule=customClean
    ?(LANG==="vi"?`- Yêu cầu riêng của giáo viên: ${customClean}\n`:`- Extra teacher instructions: ${customClean}\n`)
    :"";

  const hdr=LANG==="vi"
    ?`Bạn là giáo viên viết nhận xét tổng hợp (gộp CẢ kết quả học tập VÀ nề nếp) cho từng học sinh trong giai đoạn ${fromD} đến ${toD} bằng tiếng Việt.\nPhong cách: ${toneDesc}.\nQuy tắc bắt buộc:\n- Bắt đầu mỗi nhận xét bằng đúng nhãn học sinh (ví dụ "Học sinh 3"); không dùng đại từ anh ấy/cô ấy/cậu ấy.\n- KẾT HỢP MƯỢT MÀ cả học tập (bài đánh giá, tiến độ) và nề nếp (tích cực, cần nhắc nhở) thành một đoạn văn thống nhất — không tách rời hay liệt kê khô khan.\n- CHỈ dựa trên dữ liệu đã cung cấp, không bịa thêm chi tiết.\n- Tạo sự đa dạng giữa các học sinh (không lặp mở đầu giống nhau).\n${numRule}${customRule}- Trả về DUY NHẤT danh sách, mỗi học sinh một dòng (không markdown ** hay dấu đầu dòng), ví dụ:\n1: Học sinh 1 ...\n2: Học sinh 2 ...\n\nDữ liệu học sinh:\n`
    :`You are a classroom teacher writing a combined student report summary (blending BOTH academic performance AND classroom behaviour) for ${fromD} to ${toD} in English.\nTone & style: ${toneDesc}.\nStrict rules:\n- Start every summary with the exact student label (e.g. "Student 3") and avoid he/she/they pronouns.\n- WEAVE academic results/progress and classroom behaviour together into one smooth, cohesive paragraph — never a robotic list.\n- Stay strictly grounded in the provided data; do not invent skills, grades, or events.\n- Vary openings and phrasing distinctly across students.\n${numRule}${customRule}- Return ONLY the list with one student per line (no markdown bolding or bullets), like:\n1: Student 1 ...\n2: Student 2 ...\n\nStudent data:\n`;
  return hdr+entries.join("\n\n");

function buildActiveAiPrompt(kind,tone,custom,noNum,onlyStu,from,to){
  const p=kind==="beh"?buildBehAiPrompt(tone,custom,noNum,onlyStu,from,to)
    :kind==="rep"?buildRepAiPrompt(tone,custom,noNum,onlyStu,from,to)
    :buildAiPrompt(tone,custom,noNum,onlyStu,from,to);
  return p?anonymizeRealNames(p):"";
}

function applyAiResponse(raw,onlyStu,kind){
  if(!raw||!raw.trim())return 0;
  let count=0,curIdx=null;
  const map={};
  const rx=/^\s*(?:[#>*•\-]+\s*)?(?:\*\*)?\s*(?:(\d{1,3})(?:\*\*)?\s*[:.\)\-–—]+\s*|((?:Student|Học sinh)\s+(\d{1,3})\b)\s*(?:\*\*)?\s*[:\-–—]?\s*)(.*)$/i;
  raw.split(/\r?\n/).forEach(line=>{
    const trimmed=line.trim();
    if(!trimmed)return;
    const m=trimmed.match(rx);
    if(m){
      const idx=+(m[1]||m[3]);
      if(idx>=1&&idx<=S.n){
        curIdx=idx;
        const rest=(m[4]||"").replace(/^\*\*|\*\*$/g,"").trim();
        map[idx]=(m[2]&&!/^(?:Student|Học sinh)\s/i.test(rest))?(m[2]+" "+rest).trim():rest;
        return;
      }
    }
    if(curIdx!=null)map[curIdx]=(map[curIdx]?map[curIdx]+" ":"")+trimmed;
  });
  // Fallback when regenerating a single student and the model omits the leading "1:"
  if(!Object.keys(map).length&&onlyStu){
    map[onlyStu]=raw.trim();
  }
  Object.entries(map).forEach(([idxStr,txt])=>{
    const idx=+idxStr;
    if(onlyStu&&idx!==onlyStu)return;
    const realName=nm(idx);
    let clean=txt
      .replace(/\[NAME\]/gi,realName)
      .replace(new RegExp(`\\bStudent\\s+0?${idx}\\b`,"gi"),realName)
      .replace(new RegExp(`Học sinh\\s+0?${idx}\\b`,"gi"),realName)
      .replace(/\*\*/g,"")
      .trim();
    if(clean){
      const k0=kind||_aiKind||"score";
      if(k0==="beh"){S.bcom=S.bcom||{};S.bcom[bPeriod()+"|"+idx]=clean}
      else if(k0==="rep"){S.repsum=S.repsum||{};S.repsum[`${S.rfrom||today()}|${S.rto||today()}|${idx}`]=clean}
      else S.ed[idx]=clean;
      count++;
    }
  });
  if(count){
    save();
    const k0=kind||_aiKind||"score";
    if(k0==="beh")rBeh();else if(k0==="rep")rRepTab();else rCom();
  }
  return count;
}

function aiErrText(err){
  const raw=(err&&err.message)?err.message:String(err),vi=LANG==="vi";
  let m="";
  if(/failed to fetch|networkerror|load failed/i.test(raw))m=vi?"Không kết nối được tới dịch vụ AI. Kiểm tra mạng, hoặc trang này có được phép kết nối ra ngoài không.":"Could not reach the AI service. Check your internet connection and that the page you are using is allowed to connect to outside services.";
  else if(/429|quota|rate.?limit|resource.?exhausted|too many/i.test(raw))m=vi?"Đã chạm giới hạn hoặc hết hạn mức. Chờ một phút rồi thử lại, hoặc kiểm tra gói và hạn mức của key.":"Rate limit or quota reached. Wait a minute and try again, or check your plan and quota.";
  else if(/401|403|api key|invalid|permission|unauthor|incorrect/i.test(raw))m=vi?"API key bị từ chối. Kiểm tra lại key và nhà cung cấp đã chọn.":"The API key was rejected. Check the key and the provider you selected.";
  return m?m+" ("+raw+")":raw;
}
function comWarn(txt){

async function fetchTimeout(url,opts,ms=60000){
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),ms);
  try{return await fetch(url,Object.assign({},opts,{signal:ctrl.signal}))}
  catch(e){if(e&&e.name==="AbortError")throw new Error(t("ai_timeout"));throw e}
  finally{clearTimeout(timer)}
}

const _sleep=ms=>new Promise(r=>setTimeout(r,ms));
let _gemModelsCache=null;
async function listGeminiModels(key){
  if(_gemModelsCache&&_gemModelsCache.key===key&&_gemModelsCache.list.length)return _gemModelsCache.list;
  const fallback=["gemini-2.5-flash","gemini-2.5-flash-lite","gemini-2.0-flash","gemini-2.0-flash-lite"];
  try{
    const res=await fetchTimeout(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(key)}`,{},20000);
    const rawTxt=await res.text();
    let data={};try{data=JSON.parse(rawTxt)}catch(e){}
    if(!res.ok){
      const msg=(data.error&&data.error.message)||(`${res.status} ${res.statusText}`);
      if(res.status===401||res.status===403||/api key|invalid|permission/i.test(msg))throw new Error(msg);
      return fallback;
    }
    const all=(data.models||[])
      .filter(m=>m.name&&Array.isArray(m.supportedGenerationMethods)&&m.supportedGenerationMethods.includes("generateContent"))
      .map(m=>m.name.replace(/^models\//,""))
      .filter(n=>/^gemini/i.test(n)&&!/embedding|imagen|image|veo|tts|audio|live|computer-use|robotics|aqa|vision|thinking|customtools/i.test(n));
    // Strongly prefer stable GA flash models first, then flash-lite, then other stable models, then previews last
    const score=n=>{
      let s=0;
      if(/flash/i.test(n))s+=100;
      if(/lite/i.test(n))s-=4;
      if(/exp|preview/i.test(n))s-=50;
      if(/latest/i.test(n))s-=15;
      const mv=n.match(/gemini-(\d+(?:\.\d+)?)/i);
      if(mv)s+=parseFloat(mv[1])*10;
      return s;
    };
    all.sort((a,b)=>score(b)-score(a));
    const list=all.length?all:fallback;
    _gemModelsCache={key,list};
    return list;
  }catch(e){
    if(/api key|invalid|permission|401|403/i.test(String(e&&e.message||e)))throw e;
    return fallback;
  }
}

async function callAiApi(prov,key,prompt){
  if(prov==="gemini"){
    const models=await listGeminiModels(key);
    let lastErr="Unknown Gemini API error";
    const candidates=models.slice(0,8);
    for(const model of candidates){
      // Disable internal thinking on 2.5-flash models so comments return in ~2-4s instead of timing out
      const genCfg={temperature:0.8};
      if(/^gemini-2\.5-flash/i.test(model))genCfg.thinkingConfig={thinkingBudget:0};
      for(let attempt=0;attempt<2;attempt++){
        let res;
        try{
          res=await fetchTimeout(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:genCfg})
          },45000);
        }catch(netErr){
          lastErr=(netErr&&netErr.message)||String(netErr);
          // On timeout, try the next faster model instead of aborting immediately
          if(/timed out|hết thời gian/i.test(lastErr))break;
          throw netErr;
        }
        const rawTxt=await res.text();
        let data={};try{data=JSON.parse(rawTxt)}catch(e){}
        if(res.ok){
          const out=data.candidates&&data.candidates[0]&&data.candidates[0].content&&data.candidates[0].content.parts
            ?data.candidates[0].content.parts.filter(p=>!p.thought).map(p=>p.text||"").join("\n").trim():"";
          if(out){
            // Promote working model to front of cache so next calls succeed immediately
            if(_gemModelsCache&&_gemModelsCache.key===key){
              _gemModelsCache.list=[model,..._gemModelsCache.list.filter(m=>m!==model)];
            }
            return out;
          }
          lastErr="Empty response from Gemini";
          break;
        }
        lastErr=(data.error&&data.error.message)||(`${res.status} ${res.statusText}`);
        // If this model rejects thinkingConfig, retry once without it
        if(res.status===400&&genCfg.thinkingConfig&&/thinking/i.test(lastErr)&&attempt===0){
          delete genCfg.thinkingConfig;
          continue;
        }
        // Auth errors: stop immediately
        if(res.status===401||res.status===403||/api key not valid|invalid api key|permission denied/i.test(lastErr)){
          throw new Error(lastErr);
        }
        // High demand / temporary overload: retry once briefly, then fall back to next model
        if((res.status===503||res.status===500||/overloaded|high demand|unavailable|try again/i.test(lastErr))&&attempt===0){
          await _sleep(1200);
          continue;
        }
        // Any model-specific / quota / 404 / 429 / 503 error: try next available model
        break;
      }
    }
    throw new Error(lastErr);
  }else{
    const oaiModels=["gpt-4o-mini","gpt-4.1-mini"];
    let lastErr="Unknown OpenAI API error";
    for(const model of oaiModels){
      for(let attempt=0;attempt<2;attempt++){
        const res=await fetchTimeout("https://api.openai.com/v1/chat/completions",{
          method:"POST",
          headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},
          body:JSON.stringify({model,temperature:0.8,messages:[{role:"user",content:prompt}]})
        });
        const rawTxt=await res.text();
        let data={};try{data=JSON.parse(rawTxt)}catch(e){}
        if(res.ok){
          const out=data.choices&&data.choices[0]&&data.choices[0].message?data.choices[0].message.content:"";
          if(out)return out;
          lastErr="Empty response from OpenAI";
          break;
        }
        lastErr=(data.error&&data.error.message)||(`${res.status} ${res.statusText}`);
        if(res.status===401||res.status===403||/incorrect api key|invalid_api_key/i.test(lastErr))throw new Error(lastErr);
        if((res.status===503||res.status===429||res.status===500)&&attempt===0){await _sleep(1200);continue}
        break;
      }
    }
    throw new Error(lastErr);
  }
}

async function runDirectAi(){
  const {prov,key,tone,custom,noNum}=readAiUi();
  const btn=$("aiRunBtn");
  const reset=()=>{if(btn){btn.disabled=false;btn.dataset.ok="";btn.textContent="✨ "+t("ai_run_btn")}};
  if(!key){setAiStatus("err",t("ai_need_key"));reset();return}
  const stu=_aiTargetStu,k0=_aiKind||"score";
  const ranges=[];
  if(stu)ranges.push([stu,stu]);else for(let a=1;a<=S.n;a+=8)ranges.push([a,Math.min(S.n,a+7)]);
  const jobs=ranges.map(r=>({r,p:stu?buildActiveAiPrompt(k0,tone,custom,noNum,stu):buildActiveAiPrompt(k0,tone,custom,noNum,null,r[0],r[1])})).filter(j=>j.p);
  if(!jobs.length){setAiStatus("err",aiEmptyMsg(k0,stu));reset();return}
  btn.disabled=true;btn.textContent=t("ai_running");
  let total=0,bad=0,lastRaw="";
  try{
    for(let k=0;k<jobs.length;k++){
      if(k>0)await _sleep(700);
      setAiStatus("info",t("ai_running")+(jobs.length>1?" "+(k+1)+"/"+jobs.length:""));
      const text=await callAiApi(prov,key,jobs[k].p);
      const n=applyAiResponse(text,stu,k0);
      if(n)total+=n;else{bad++;lastRaw=text}
    }
    if(total){closeAiModal();toast(aiFilledMsg(k0,total,stu)+(bad?" ("+bad+" batch not read)":""))}
    else{if($("aiPaste"))$("aiPaste").value=lastRaw;setAiStatus("err",t("ai_no_parse"))}
  }catch(err){
    setAiStatus("err",t("ai_err")+aiErrText(err)+(total?" ("+total+" comments were already filled)":""));
  }finally{reset()}
}

  }
  else if(a=="pv-ai"){const cfg=getAiCfg();if(cfg.key&&!_aiSkipConfirm)return openAiConfirm(()=>runPvAi());return runPvAi()}
  else if(a=="pv-copy"){const p=buildPvPrompt(+S.pvstu||1,S.pvfrom||today(),S.pvto||today());if(p)copy(p);else toast(t("pv_no_data"));return}
  else if(a=="pv-print"){window.print();return}
  else if(a=="csvr"){
    const p=bPeriod();
    let r=[[t("col_no"),t("col_name"),t("col_pos"),t("col_con"),t("col_urg"),t("col_com")].map(q).join(",")];
    for(let j=1;j<=S.n;j++){
      const logs=bLogsFor(j);
      const pos=logs.filter(x=>ct(x.c)==="+").length,con=logs.filter(x=>ct(x.c)==="-").length,urg=logs.filter(x=>ct(x.c)==="!").length;
      const com=(S.bcom&&S.bcom[p+"|"+j])||"";
      r.push([pad(j),nm(j),pos,con,urg,com].map(q).join(","));
    }
    exp((S.cl[S.ac].name||"class").replace(/[^\w\-]+/g,"_")+"_behaviour_"+p+".csv",r.join("\n"));
  }
  else if(a=="preset"){
    const pr=PRESETS[b.dataset.v];if(!pr)return;
    S.crit.forEach(x=>{x.on=pr.crit.includes(x.id)});
    S.tick.forEach(x=>{x.on=pr.tick.includes(x.id)});
    save();rSet();toast(t("t_preset",{n:t(pr.key)}));
  }
  else if(a=="cedit"){openCritEdit[c]=!openCritEdit[c];rSet()}
  else if(a=="togt"){if(S.tick[i]){S.tick[i].on=!(S.tick[i].on!==false);save();rSet()}}
  else if(a=="togb"){if(S.chips[i]){S.chips[i].on=!(S.chips[i].on!==false);save();rSet()}}
  else if(a=="dc"){S.crit.splice(i,1);save();rSet()}else if(a=="dt"){S.tick.splice(i,1);save();rSet()}else if(a=="db"){S.chips.splice(i,1);save();rSet()}
  else if(a=="ac"){
    const id=uid();
    const item=LANG==="vi"
      ?C(id,"Tiêu chí mới","[NAME] thực hiện tốt tiêu chí này.","[NAME] đang tiến bộ ở tiêu chí này.","[NAME] cần hỗ trợ thêm ở tiêu chí này.","Custom",true)
      :C(id,"New criterion","[NAME] does this well.","[NAME] is developing this skill.","[NAME] needs support with this.","Custom",true);
    S.crit.push(item);openCritEdit[id]=true;save();rSet();
  }
  else if(a=="at"){
    const item=LANG==="vi"
      ?{id:uid(),n:"Thẻ mới",st:"[NAME] làm tốt phần này.",ns:"Luyện tập thêm phần này.",cat:"Custom",on:true}
      :{id:uid(),n:"New tick",st:"[NAME] did well with this.",ns:"Practise this next.",cat:"Custom",on:true};
    S.tick.push(item);save();rSet();
  }
  else if(a=="ab"){S.chips.push({id:uid(),n:LANG==="vi"?"Nút mới":"New button",t:"+",on:true});save();rSet()}
  else if(a=="pnew"){
    const id=uid(),tp=$("pt").value,d=$("pdte").value||today();
    const item={id:id,n:$("pn").value.trim()||pTypeName(tp),t:tp,sk:$("ps").value.trim()||(LANG==="vi"?"Chung":"General"),d:d,r:{}};
    if(tp==="h")item.counts={g:0,n:0,y:0};
    if(tp==="x"){item.nt=Math.max(1,Math.min(200,+($("pxn")&&$("pxn").value)||10));item.tickets={};item.showRep=false}
    PR().push(item);S.cur=id;pDateFilter=d;save();rProg();bn();
  }
  else if(a=="hstep"){
    const ch=PR().find(x=>x.id==c);if(!ch)return;
    ch.counts=ch.counts||{g:0,n:0,y:0};
    const k=b.dataset.v,delta=+b.dataset.d;
    ch.counts[k]=Math.max(0,Math.min(200,(+ch.counts[k]||0)+delta));
    save();rProg();
  }
  else if(a=="tkt"){
    const ch=PR().find(x=>x.id==c);if(!ch)return;
    ch.tickets=ch.tickets||{};
    const v=b.dataset.v;
    if(ch.tickets[i]===v)delete ch.tickets[i];else ch.tickets[i]=v;
    save();
    const curV=ch.tickets[i]||"";
    const card=b.closest(".tkt-card");
    if(card){
      card.className="tkt-card"+(curV?" st-"+curV:"");
      card.querySelectorAll(".k").forEach(x=>x.classList.toggle("on",x.dataset.v===curV));
      const bd=card.querySelector(".tkt-b");
      if(bd){bd.className="badge tkt-b "+pBadgeCls(curV);bd.textContent=curV?pLabel(curV):t("pending")}
    }
    const st=tktStats(ch),tc=$("tktCount"),tr=$("tktRep"),dw=$("pDateWrap");
    if(tc)tc.textContent=`${st.done} / ${st.total} ${t("graded")} · ${st.g} ${t("got_it_l")}`;
    if(tr&&ch.showRep)tr.innerHTML=rExitReportHtml(ch);
    if(dw)dw.innerHTML=rDateLog();
  }
  else if(a=="tktrep"){
    const ch=PR().find(x=>x.id==c);if(!ch)return;
    ch.showRep=true;save();
    const tr=$("tktRep");if(tr)tr.innerHTML=rExitReportHtml(ch);
    toast(t("t_rep_gen"));
  }
  else if(a=="tktcopy"){
    const ch=PR().find(x=>x.id==c);if(!ch)return;
    const st=tktStats(ch);
    const txt=`${t("tkt_rep_badge")} — ${ch.n} (${ch.sk}, ${ch.d})\n${t("tkt_got_concept",{g:st.g,d:st.done,p:st.gp})}\n- ${t("got_it")}: ${st.g} (${st.gp}%)\n- ${t("nearly")}: ${st.n} (${st.np}%)\n- ${t("not_yet")}: ${st.y} (${st.yp}%)`;
    copy(txt);
  }
  else if(a=="pdate"){pDateFilter=b.dataset.v;const dw=$("pDateWrap");if(dw)dw.innerHTML=rDateLog()}
  else if(a=="pr"){const ch=PR().find(x=>x.id==c);if(!ch)return;ch.r=ch.r||{};const v=b.dataset.v;if(ch.r[i]==v){delete ch.r[i];b.classList.remove("on")}else{ch.r[i]=v;b.parentNode.querySelectorAll(".k").forEach(x=>x.classList.toggle("on",x===b))}save();const dw=$("pDateWrap");if(dw)dw.innerHTML=rDateLog()}
  else if(a=="pdel"){if(b.dataset.s){S.pr=PR().filter(x=>x.id!=c);S.cur=null;save();rProg()}else{b.dataset.s=1;b.textContent=t("t_tap_del")}}
  else if(a=="pgen")pgen();else if(a=="pcopy")copy(PT);
  else if(a=="bk")bkp();
  else if(a=="cadd"){const n=$("cn").value.trim()||(LANG==="vi"?"Lớp ":"Class ")+(Object.keys(S.cl).length+1),id=uid();stash();S.cl[id]={name:n};clsOpen=false;swc(id)}
  else if(a=="cdel"){if(Object.keys(S.cl).length<2)return toast(t("t_keep_one"));if(b.dataset.s){delete S.cl[S.ac];ldc(Object.keys(S.cl)[0]);save();clsOpen=false;show(V0);toast(t("t_cls_del"))}else{b.dataset.s=1;b.textContent=t("t_tap_del")}}
  else if(a=="fin"){if(b.dataset.s){S.hist.push({id:uid(),n:S.proj||"Project",d:S.pd,sc:S.sc,tk:S.tk,nt:S.nt,ed:S.ed});S.sc={};S.tk={};S.nt={};S.ed={};S.proj="";save();rMark();toast(t("t_prj_saved"))}else{b.dataset.s=1;b.textContent=t("t_tap_fin")}}
  else if(a=="rs"){try{const x=JSON.parse($("rs").value);if(!x||!x.crit)throw 0;S=mig(x);save();rSet();toast(t("t_restored"))}catch(er){toast(t("t_bad_bk"))}}
  else if(a=="rz"){if(b.dataset.s){S=mig(JSON.parse(JSON.stringify(D)));save();show(V0);toast(t("t_erased"))}else{b.dataset.s=1;b.textContent=t("t_tap_erase")}}
});

document.addEventListener("input",e=>{
  const el=e.target;
  if(el.id==="aiCustom")return updAiPreview();
  if(el.dataset.sfq){const v=el.dataset.sfq;if(SF[v]){SF[v].q=el.value;applySf(v)}return}
  if(el.dataset.e){
    S.ed[el.dataset.e]=el.value;save();
    const cw=document.querySelector(`.com-warn[data-cw="${el.dataset.e}"]`);
    if(cw)cw.innerHTML=comWarn(el.value);
    return;
  }
  if(el.dataset.ph){
    const ch=PR().find(x=>x.id==el.dataset.ph);if(!ch)return;
    ch.counts=ch.counts||{g:0,n:0,y:0};
    ch.counts[el.dataset.pk]=Math.max(0,Math.min(200,+el.value||0));
    save();
    const g=+ch.counts.g||0,n=+ch.counts.n||0,y=+ch.counts.y||0,tot=g+n+y;
    const gp=tot?Math.round(g*100/tot):0,np=tot?Math.round(n*100/tot):0,yp=tot?Math.max(0,100-gp-np):0;
    const bar=$("hBar"),sum=$("hSum"),dw=$("pDateWrap");
    if(bar){bar.querySelector(".bar-g").style.width=gp+"%";bar.querySelector(".bar-n").style.width=np+"%";bar.querySelector(".bar-y").style.width=yp+"%"}
    if(sum)sum.innerHTML=`${t("tot_resp")} <b>${tot}</b>${tot?` (${gp}% ${t("got_it")} · ${np}% ${t("nearly")} · ${yp}% ${t("not_yet")})`:""}`;
    if(dw)dw.innerHTML=rDateLog();
    return;
  }
  if(el.dataset.nt){
    S.nt=S.nt||{};
    S.nt[el.dataset.nt]=el.value;
    save();return;
  }
  if(el.dataset.rsum){S.repsum=S.repsum||{};S.repsum[el.dataset.rsum]=el.value;save();return}
  if(el.dataset.pv){
    S.pv=S.pv||{};
    S.pv[el.dataset.pv]=el.value;
    save();
    const pt=$("pvPrintTxt");if(pt)pt.textContent=el.value||t("pv_no_data");
    return;
  }
  if(el.dataset.bc){
    S.bcom=S.bcom||{};
    S.bcom[el.dataset.bc]=el.value;
    save();return;
  }
  if(el.dataset.ptn){
    const ch=PR().find(x=>x.id==el.dataset.ptn);if(!ch)return;
    ch.nt=Math.max(1,Math.min(200,+el.value||1));
    save();rProg();return;
  }
  const p=el.dataset.f;if(!p)return;
  const k=p.split(".");let o=S;
  for(let j=0;j<k.length-1;j++)o=o[k[j]];
  const l=k[k.length-1];
  o[l]=(l=="n"&&k.length==1)?Math.max(1,Math.min(200,+el.value||1)):(l=="pvstu"?Math.max(1,Math.min(S.n,+el.value||1)):el.value);
  save();
  if(p.startsWith("cl.")||p=="n"||p=="roster")rTop();
  if(p==="bd"||p==="bm")rBeh();
  if(p==="rfrom"||p==="rto"||p==="pvfrom"||p==="pvto"||p==="pvstu")rRepTab();
});

document.addEventListener("change",e=>{
  if(e.target&&e.target.id==="aiSkipChk"){_aiSkipConfirm=e.target.checked;return}
  if(e.target&&(e.target.id==="aiTone"||e.target.id==="aiNoNum"))return updAiPreview();
  if(e.target.dataset&&e.target.dataset.tog==="crit"){const idx=+e.target.dataset.i;if(S.crit[idx]){S.crit[idx].on=e.target.checked;save();rSet()}return}
  if(e.target.id=="cs")return swc(e.target.value);
  if(e.target.id=="rf"){const f=e.target.files[0];if(f){const r=new FileReader();r.onload=ev=>rst(String(ev.target.result));r.readAsText(f)}return}
  if(e.target.id=="fl")upl(e.target.files[0]);
  if(e.target.id=="pc"){S.cur=e.target.value;const ch=PR().find(x=>x.id==S.cur);if(ch&&ch.d)pDateFilter=ch.d;save();rProg()}
  if(e.target.id=="pDatePick"){pDateFilter=e.target.value;const dw=$("pDateWrap");if(dw)dw.innerHTML=rDateLog()}
  if(e.target.id=="pt"){const w=$("pxnWrap");if(w)w.classList.toggle("hid",e.target.value!=="x")}
  if(e.target.id=="pvStu"){S.pvstu=Math.max(1,Math.min(S.n,+e.target.value||1));save();rRepTab()}
});

window.addEventListener("hashchange",()=>show(location.hash.slice(1)));
try{navigator.storage.persist()}catch(e){}
initTheme();
applyLangStatic();
show(location.hash.slice(1)||"home");
</script>
